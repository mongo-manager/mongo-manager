# Mongo Manager behind nginx with TLS.
# Start Mongo Manager with:
#   mongo-manager start --auth --host 127.0.0.1 --trusted-proxies 127.0.0.1 --allowed-hosts mm.example.com
# (or the same options in /etc/mongo-manager/config.json when installed as a service).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name mm.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mm.example.com;

    ssl_certificate     /etc/ssl/certs/mm.example.com.pem;
    ssl_certificate_key /etc/ssl/private/mm.example.com.key;

    # At least the largest single upload: an import (MM_TRANSFER_MAX_UPLOAD, 1024 MiB by default) or a
    # GridFS file (MM_GRIDFS_MAX_MB; raise this with it). Backups go up in 8 MiB parts. Mongo Manager
    # holds every request to its own limits.
    client_max_body_size 1100m;

    # A plugin frame's address holds its ticket, good for hours: kept out of the access log, as
    # Mongo Manager keeps it out of its own.
    location ^~ /plugin-frame/ {
        access_log off;
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        # Uploads stream through, so their progress shows and a stalled one is stopped.
        proxy_request_buffering off;
    }

    # Under a sub-path instead: start with --base-path /mongo/ and use
    #   location /mongo/ { proxy_pass http://127.0.0.1:4321; ...same headers... }
    # (no rewrite: Mongo Manager serves everything under its base path).
}
