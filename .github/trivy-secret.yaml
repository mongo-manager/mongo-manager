# CI 2026-10-18: the bundles hold ssh2's own Ed25519 test key, published in its source
# (lib/protocol/constants.js), which it signs one byte with to learn whether Node can do EdDSA.
# It opens nothing. Only that key, by its body, is allowed: any other key found still fails the scan.
allow-rules:
  - id: ssh2-eddsa-probe-key
    description: ssh2's public EdDSA support probe key
    regex: MC4CAQAwBQYDK2VwBCIEIHKj\+sVa9WcD/q2DJUJaf43Kptc8xYuUQA4bOFj9vC8T
