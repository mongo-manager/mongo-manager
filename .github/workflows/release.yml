name: Release

# Builds every offline artifact of a version (spec §3.6): the npm tarball, standalone binaries,
# Docker image archives, and SHA-256 checksums over all of them, into a draft GitHub release.
# Publishing waits for a manual approval: environment "ghcr" pushes exactly the checksummed image
# archives, environment "npm" publishes the checksummed tarball (npm trusted publishing, OIDC).
# Environment "signing" signs SHA256SUMS (the updater installs only signed releases) before either.
# The exact Node version is pinned so the standalone binaries can be rebuilt from the same inputs.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26.10.0
          cache: pnpm
      - id: version
        name: The tag names the package version
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if [ "$EVENT" = push ] && [ "$REF" != "v$version" ]; then
            echo "tag $REF does not match package version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/verify-pack.mjs --no-build
      - name: npm tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out
          cd packages/cli && npm pack --pack-destination ../../out
          # npm names a scoped package's tarball after its scope; the release keeps the plain name.
          mv "../../out/mongo-manager-app-$VERSION.tgz" "../../out/mongo-manager-$VERSION.tgz"
      # The licences of everything the artifacts bundle, beside them (security review 2026-10-13).
      - name: Third-party notices
        run: cp packages/cli/dist/THIRD-PARTY-NOTICES.txt out/
      # Mongo Manager's own license and its additional terms (NOTICE, section 7), with every copy.
      - name: License
        run: cp LICENSE NOTICE out/
      # The updater: the version, the oldest Node and the oldest image this release runs on.
      - name: release.json
        run: node scripts/release-info.mjs out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm
          path: |
            out/*.tgz
            out/THIRD-PARTY-NOTICES.txt
            out/LICENSE
            out/NOTICE
            out/release.json
          if-no-files-found: error

  standalone:
    needs: package
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x64, exe: mongo-manager }
          - { os: ubuntu-24.04-arm, target: linux-arm64, exe: mongo-manager }
          - { os: windows-latest, target: win-x64, exe: mongo-manager.exe }
          - { os: macos-latest, target: macos-arm64, exe: mongo-manager }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26.10.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Builds the binary and proves it runs alone, with no Node on PATH.
      - run: pnpm --filter @mongo-manager/app test:sea
      - name: Name the binary
        shell: bash
        env:
          VERSION: ${{ needs.package.outputs.version }}
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
        run: |
          mkdir -p out
          ext="${EXE#mongo-manager}"
          cp "packages/cli/dist/sea/$EXE" "out/mongo-manager-$VERSION-$TARGET$ext"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standalone-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  # Builds the image archives only; nothing is pushed from here.
  docker:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image archives for docker load (amd64, arm64)
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --provenance=false -t "mongo-manager:$VERSION" \
              --build-arg "VERSION=$VERSION" --build-arg "REVISION=$GITHUB_SHA" \
              --build-arg "CREATED=$(date -u -d "@$SOURCE_DATE_EPOCH" +%Y-%m-%dT%H:%M:%SZ)" \
              -o "type=docker,dest=out/mongo-manager-$VERSION-$arch.tar,rewrite-timestamp=true" .
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker
          path: out/*.tar
          if-no-files-found: error

  release:
    needs: [package, standalone, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: out
          merge-multiple: true
      - name: SHA-256 checksums
        run: |
          cd out
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name == 'push'
        with:
          subject-path: out/*
      - name: Draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Mongo Manager $TAG" out/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: out/*

  # The updater (2026-11-03): SHA256SUMS signed with the project's key, once approved. The key
  # reaches this step only; the script refuses one whose public half the app does not list.
  signing:
    needs: [release]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26.10.0
          # The checkout's package.json names pnpm, which this job does not install: no cache.
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: out
      - name: Sign SHA256SUMS
        env:
          MM_RELEASE_SIGNING_KEY: ${{ secrets.MM_RELEASE_SIGNING_KEY }}
        run: node scripts/sign-release.mjs out/SHA256SUMS out/SHA256SUMS.sig
      - name: Add the signature to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" out/SHA256SUMS.sig --repo "$GITHUB_REPOSITORY"

  # Pushes the image archives that SHA256SUMS lists (not a new build), once approved.
  ghcr:
    needs: [package, release, signing]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ghcr
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: out
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        name: Push the checksummed images under one multi-arch tag
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          cd out
          grep -E ' mongo-manager-[^ ]+\.tar$' SHA256SUMS | sha256sum --check
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          for arch in amd64 arm64; do
            docker load -i "mongo-manager-$VERSION-$arch.tar"
            docker tag "mongo-manager:$VERSION" "$image:$VERSION-$arch"
            docker push "$image:$VERSION-$arch"
          done
          # The registry shows a multi-arch package's description from the index, not the images.
          docker buildx imagetools create -t "$image:$VERSION" \
            --annotation "index:org.opencontainers.image.description=Mongo Manager: a secure, offline-capable MongoDB manager in your browser." \
            --annotation "index:org.opencontainers.image.source=https://github.com/mongo-manager/mongo-manager" \
            --annotation "index:org.opencontainers.image.licenses=AGPL-3.0-only" \
            "$image:$VERSION-amd64" "$image:$VERSION-arm64"
          digest=$(docker buildx imagetools inspect "$image:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Record the image digest in the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ steps.push.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        # Below the notes written for the release, which the panel shows (final review, minor).
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          printf '\n\nDocker image: `%s@%s` (pushed from the archives listed in SHA256SUMS).\n' "$IMAGE" "$DIGEST" >> notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md

  npm:
    needs: [package, release, signing]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      # npm trusted publishing: the registry accepts this workflow's OIDC identity, no stored token.
      # Configure it once on npmjs.com (package settings → trusted publisher: this repository, release.yml).
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26.10.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: out
      # npm checks the provenance against packages/cli/package.json "repository" (this repository).
      - name: Publish the checksummed tarball with provenance
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          cd out
          grep -E " mongo-manager-$VERSION\.tgz$" SHA256SUMS | sha256sum --check
          npm publish "mongo-manager-$VERSION.tgz" --provenance --access public
